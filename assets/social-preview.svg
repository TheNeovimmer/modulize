<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640" role="img" aria-label="modulize — Say goodbye to messy code.">
  <defs>
    <pattern id="dots" width="34" height="34" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="2" fill="#161616"/>
    </pattern>
  </defs>

  <rect width="1280" height="640" fill="#0A0A0A"/>
  <rect width="1280" height="640" fill="url(#dots)"/>

  <!-- mark: three tangled paths merge into one clean line -->
  <g transform="translate(84,196) scale(1.95)" fill="none" stroke="#F5F5F5" stroke-linecap="round">
    <path d="M22 34c36 0 30 30 84 30" stroke-width="7"/>
    <path d="M22 64h84" stroke-width="7"/>
    <path d="M22 94c36 0 30-30 84-30" stroke-width="7"/>
  </g>

  <!-- wordmark block -->
  <text x="420" y="178" font-family="Noto Sans" font-weight="600" font-size="21" letter-spacing="6" fill="#737373">AGENT SKILL</text>
  <text x="414" y="330" font-family="Noto Sans" font-weight="800" font-size="148" letter-spacing="-3" fill="#FAFAFA">modulize</text>
  <text x="420" y="398" font-family="Noto Sans" font-weight="400" font-size="40" fill="#A3A3A3">Say goodbye to messy code.</text>

  <!-- install pill -->
  <rect x="420" y="446" width="700" height="82" rx="16" fill="#141414" stroke="#262626"/>
  <text x="452" y="498" font-family="Liberation Mono, DejaVu Sans Mono, monospace" font-size="27" fill="#E5E5E5">$ npx skills add TheNeovimmer/modulize</text>
</svg>
